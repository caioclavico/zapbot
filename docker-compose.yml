services:
  cassandra:
    image: cassandra:5
    container_name: zapbot-cassandra
    restart: unless-stopped
    environment:
      # dataset é minúsculo (só rank/loja/admins/participantes/quiz), então
      # limita o heap pra sobrar RAM pro Puppeteer/Chromium do bot na mesma VM
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    volumes:
      - cassandra-data:/var/lib/cassandra
    ports:
      # expõe pro host pra permitir rodar o bot localmente (fora do container
      # "bot", que continua falando com "cassandra" via rede interna do
      # Docker) apontando pra 127.0.0.1 em CASSANDRA_CONTACT_POINTS
      - "127.0.0.1:9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  bot:
    build: .
    container_name: zapbot
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./data:/app/data

volumes:
  cassandra-data:
