    environment:
      HEALTH_BIND_HOST: "0.0.0.0"
      STAGING_ALLOW_QR: "0"
      STAGING_BOOTSTRAP_GROUP: "0"
      STAGING_WHATSAPP_CONFIRM: "1"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/chromium-seccomp.json
    stop_grace_period: 60s
