# Odisseu Core (M9.0) — monólito modular na VM Google `odisseu-core`.
# NÃO é a VM de produção `odisseu-zapbot` nem o serviço `odisseu-pokemon`.
# NÃO publica bridge JVM / health em interface pública.
# Sem Cassandra. Sem cutover. cutover-ready? permanece false.
#
# Orçamento alvo (VM ~5,8 GiB RAM + 2 GiB swap):
#   Node+Chromium ≤ 2560m cgroup | JVM ≤ 768m | margem SO ~2–3 GiB
#
# Uso (na VM, após clone + .env.odisseu-core):
#   ./scripts/odisseu-core-up.sh
#   ./scripts/odisseu-core-down.sh
#   ./scripts/odisseu-core-backup.sh
#
# Sessão WhatsApp: bind ./.wwebjs_auth_core → /app/.wwebjs_auth (clientId=core).
# NUNCA monte .wwebjs_auth da produção.

name: odisseu-core

services:
  odisseu-jvm:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    container_name: odisseu-core-jvm
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ODISSEU_BRIDGE_HOST: "0.0.0.0"
      ODISSEU_BRIDGE_PORT: "18090"
      ODISSEU_BRIDGE_ALLOW_PRIVATE_BIND: "true"
      ODISSEU_BRIDGE_TOKEN: ${ODISSEU_BRIDGE_TOKEN:?Defina ODISSEU_BRIDGE_TOKEN}
      ODISSEU_BRIDGE_SYSTEM: odisseu-m90-core
      ODISSEU_BRIDGE_STORAGE: /data/datomic-local
      ODISSEU_BRIDGE_DB: core
      ODISSEU_PLATFORM_DB: platform
      ODISSEU_PLATFORM_ENABLED: "true"
      # Seed só na primeira subida controlada; default false em core.
      ODISSEU_BRIDGE_SEED: ${ODISSEU_BRIDGE_SEED:-false}
      ODISSEU_BRIDGE_RESET: ${ODISSEU_BRIDGE_RESET:-false}
      ODISSEU_BRIDGE_ALLOW_TEST_RNG: ${ODISSEU_BRIDGE_ALLOW_TEST_RNG:-true}
      # Paths de journal/maint (domínio de falha distinto do volume Datomic).
      ODISSEU_JOURNAL_DIR: /data/journal
      ODISSEU_MAINT_DIR: /data/maint
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:+UseG1GC"
    volumes:
      - odisseu-core-datomic:/data/datomic-local
      - odisseu-core-journal:/data/journal
      - odisseu-core-maint:/data/maint
    # Somente loopback do host — nunca 0.0.0.0:18090 no host.
    ports:
      - "127.0.0.1:18090:18090"
    networks:
      - core-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  odisseu-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odisseu-core-node
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      odisseu-jvm:
        condition: service_healthy
    env_file:
      - .env.odisseu-core
    environment:
      APP_ENV: staging
      BOT_NAME: ${BOT_NAME:-Odisseu-Core}
      POKEMON_ADAPTER: jvm
      POKEMON_JVM_URL: http://odisseu-jvm:18090
      POKEMON_JVM_TOKEN: ${ODISSEU_BRIDGE_TOKEN:?Defina ODISSEU_BRIDGE_TOKEN}
      POKEMON_SERVICE_URL: ""
      POKEMON_SERVICE_TOKEN: ""
      PLATFORM_ADAPTER: datomic
      PLATFORM_JVM_URL: http://odisseu-jvm:18090
      PLATFORM_JVM_TOKEN: ${ODISSEU_BRIDGE_TOKEN:?Defina ODISSEU_BRIDGE_TOKEN}
      PLATFORM_JVM_ALLOW_PRIVATE_HOST: "true"
      NODE_OPTIONS: --max-old-space-size=384
      CHROMIUM_DISABLE_GPU: "true"
      CHROMIUM_LOW_RESOURCE_MODE: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      # Path no container; clientId=core → session-core/ no volume bind.
      WWEBJS_DATA_PATH: /app/.wwebjs_auth
      WWEBJS_CLIENT_ID: core
      # Gates: preencher DEV_GROUP_ID + STAGING_* no .env.odisseu-core
    volumes:
      # Bind exclusivo — NÃO monte .wwebjs_auth de odisseu-zapbot.
      - ./.wwebjs_auth_core:/app/.wwebjs_auth
      - odisseu-core-data:/app/data
    networks:
      - core-internal
    mem_limit: 2560m
    memswap_limit: 3584m
    cpus: 1.5
    ports:
      # Health Node só em loopback.
      - "127.0.0.1:3001:3001"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Healthcheck da imagem exige WhatsApp READY; sem sessão fica degraded (esperado).

networks:
  core-internal:
    driver: bridge
    # Bridge Docker interna; publish host só em 127.0.0.1 acima.
    internal: false

volumes:
  odisseu-core-datomic:
    name: odisseu-core-datomic
  odisseu-core-journal:
    name: odisseu-core-journal
  odisseu-core-maint:
    name: odisseu-core-maint
  odisseu-core-data:
    name: odisseu-core-data
