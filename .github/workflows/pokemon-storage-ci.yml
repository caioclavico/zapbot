name: Pokémon storage progression CI

on:
  push:
    branches: [feature/pokemon-storage-progression]
    paths:
      - 'pokemon-service/**'
      - '.github/workflows/pokemon-storage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pokemon-storage:
    name: Test and build Pokémon service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pokemon-service/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: pokemon-service
      - run: npm test
        working-directory: pokemon-service
      - run: npm run test:domain
        working-directory: pokemon-service
      - run: npm run build
        working-directory: pokemon-service
