name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapbot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Testar, construir imagem e enviar à VM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - name: Validar deploy e retorno à imagem anterior
        run: |
          bash -n scripts/deploy-vm.sh
          python3 scripts/test-deploy.py
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagem Linux AMD64 no runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zapbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enviar imagem e atualizar somente o bot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          SSH_HOST: ${{ vars.ORACLE_HOST || '129.148.52.187' }}
          SSH_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SSH_PORT: ${{ vars.ORACLE_SSH_PORT || '22' }}
          APP_DIR: ${{ vars.ORACLE_APP_DIR || '/home/ubuntu/zapbot' }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || {
            echo '::error::Configure ORACLE_SSH_KEY e ORACLE_KNOWN_HOSTS para a VM atual.'
            exit 1
          }
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 2
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key -P '' >/dev/null
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          target="$SSH_USER@$SSH_HOST"
          release_dir="$APP_DIR/releases/$GITHUB_SHA"
          echo "[$(date -u +%FT%TZ)] Preparando diretório da release na VM (limite: 60s)."
          timeout 60s ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" "mkdir -p '$release_dir'"
          # Separa rede e Docker: o carregamento só começa após validar o arquivo.
          image_archive="$RUNNER_TEMP/zapbot-image.tar.gz"
          echo "[$(date -u +%FT%TZ)] Verificando Docker e espaço livre na VM."
          timeout 60s ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" \
            "set -eu; df -h '$release_dir'; if timeout 15s docker info >/dev/null 2>&1; then docker version --format '{{.Server.Version}}'; else timeout 15s sudo -n docker info --format '{{.ServerVersion}}'; fi"
          echo "[$(date -u +%FT%TZ)] Exportando e comprimindo imagem no runner."
          docker save "zapbot:$GITHUB_SHA" | gzip -6 > "$image_archive"
          archive_bytes=$(stat -c %s "$image_archive")
          archive_sha=$(sha256sum "$image_archive" | cut -d ' ' -f 1)
          echo "Imagem comprimida: $archive_bytes bytes."
          echo "[$(date -u +%FT%TZ)] Transferindo arquivo para a VM (limite: 15min)."
          timeout 15m scp "${ssh_opts[@]}" -P "$SSH_PORT" "$image_archive" "$target:$release_dir/image.tar.gz" &
          transfer_pid=$!
          # scp desativa a barra de progresso no Actions; informa bytes a cada 30s.
          (
            while kill -0 "$transfer_pid" 2>/dev/null; do
              sleep 30
              kill -0 "$transfer_pid" 2>/dev/null || break
              timeout 10s ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" \
                "stat -c 'Transferidos: %s de $archive_bytes bytes' '$release_dir/image.tar.gz'" || true
            done
          ) &
          progress_pid=$!
          transfer_status=0
          wait "$transfer_pid" || transfer_status=$?
          kill "$progress_pid" 2>/dev/null || true
          wait "$progress_pid" 2>/dev/null || true
          if [[ "$transfer_status" != 0 ]]; then
            echo "::error::Transferência SSH falhou (código $transfer_status). O docker load e a atualização do bot não foram iniciados."
            exit "$transfer_status"
          fi
          echo "[$(date -u +%FT%TZ)] Transferência concluída. Validando SHA-256 (limite: 120s)."
          timeout 120s ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" \
            "printf '%s  %s\\n' '$archive_sha' '$release_dir/image.tar.gz' | sha256sum -c -"
          echo "[$(date -u +%FT%TZ)] Carregando imagem no Docker da VM (limite: 8min)."
          if timeout 9m ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" \
            "set -eu; if timeout 15s docker info >/dev/null 2>&1; then timeout 8m docker load -i '$release_dir/image.tar.gz'; else timeout 8m sudo -n docker load -i '$release_dir/image.tar.gz'; fi; rm -f '$release_dir/image.tar.gz'"; then
            echo "[$(date -u +%FT%TZ)] Imagem carregada na VM."
          else
            echo '::error::Arquivo transferido e validado, mas o Docker da VM falhou ou demorou demais para carregar a imagem. O bot ainda não foi atualizado.'
            exit 1
          fi
          echo "[$(date -u +%FT%TZ)] Copiando arquivos do deploy (limite: 120s)."
          timeout 120s scp "${ssh_opts[@]}" -P "$SSH_PORT" docker-compose.production.yml scripts/deploy-vm.sh "$target:$release_dir/"
          echo "[$(date -u +%FT%TZ)] Iniciando atualização do bot e verificação de saúde."
          ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$target" "bash '$release_dir/deploy-vm.sh' '$APP_DIR' '$GITHUB_SHA'"
      - name: Remover chave do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
