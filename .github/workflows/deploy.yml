name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (check validates Odisseu SSH only; production approval applies to deploy/rollback)
        type: choice
        options: [check, deploy, rollback]
        default: deploy
        required: true
      service:
        description: Service to deploy or roll back (check always targets Odisseu)
        type: choice
        options: [both, odisseu, pokemon]
        default: both
        required: true

# Build/PR jobs receive no production credentials. Only publication grants write.
permissions:
  contents: read

jobs:
  changes:
    name: Select affected services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      odisseu: ${{ steps.paths.outputs.odisseu }}
      pokemon: ${{ steps.paths.outputs.pokemon }}
      any: ${{ steps.paths.outputs.any }}
      services: ${{ steps.paths.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runtime, shared and documentation changes
        id: paths
        env:
          SELECTED_SERVICE: ${{ inputs.service || 'both' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci-changes.py --event "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --service "$SELECTED_SERVICE" \
            --production-baselines --github-output "$GITHUB_OUTPUT"

  deployment-tests:
    name: Validate deployment scripts (Python ${{ matrix.python-version }})
    needs: changes
    if: inputs.operation != 'rollback' && inputs.operation != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate syntax, selection, preservation and isolated rollback
        run: |
          bash -n scripts/deploy-vm.sh scripts/load-image-vm.sh scripts/install-deploy.sh scripts/ci-ssh-deploy.sh
          python3 scripts/test-ci-changes.py
          python3 scripts/test-ci-ssh.py
          node --test scripts/test-ci-registry.cjs
          python3 scripts/test-deploy.py
          python3 scripts/test-deploy-recovery.py
          python3 scripts/test-deploy-compose.py
          python3 scripts/test-load-image.py
          python3 scripts/test-deploy-ssh.py

  test-odisseu:
    name: Test and compile Odisseu
    needs: changes
    if: needs.changes.outputs.odisseu == 'true' && inputs.operation != 'rollback' && inputs.operation != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - run: npm run test:http
      - run: npm run build

  test-pokemon:
    name: Test and compile Pokemon
    needs: changes
    if: needs.changes.outputs.pokemon == 'true' && inputs.operation != 'rollback' && inputs.operation != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pokemon-service/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        working-directory: pokemon-service
      - run: npm test
        working-directory: pokemon-service
      - run: npm run test:domain
        working-directory: pokemon-service
      - run: npm run build
        working-directory: pokemon-service
      - run: node --test scripts/test-pokemon-contract.cjs scripts/test-pokemon-domain-contract.cjs

  docker-validation:
    name: Validate ${{ matrix.service }} AMD64 image (no publication)
    needs: [changes, deployment-tests, test-odisseu, test-pokemon]
    if: >-
      inputs.operation != 'check' && always() && needs.changes.result == 'success' && needs.changes.outputs.any == 'true' &&
      needs.deployment-tests.result == 'success' &&
      (needs.test-odisseu.result == 'success' || needs.test-odisseu.result == 'skipped') &&
      (needs.test-pokemon.result == 'success' || needs.test-pokemon.result == 'skipped') &&
      (github.event_name == 'pull_request' || github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image on runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service == 'pokemon' && 'pokemon-service' || '.' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: zapbot-${{ matrix.service }}:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Assert Linux AMD64 runtime image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          architecture=$(docker image inspect "zapbot-$SERVICE:ci" --format '{{.Os}}/{{.Architecture}}')
          [[ "$architecture" == linux/amd64 ]]
      - name: Exercise health failure and rollback with isolated Docker fixtures
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 scripts/test-deploy-docker.py --service "$SERVICE" --base-image "zapbot-$SERVICE:ci"

  publish:
    name: Publish immutable ${{ matrix.service }} commit image
    needs: [changes, deployment-tests, test-odisseu, test-pokemon]
    if: >-
      inputs.operation != 'check' && always() && needs.changes.result == 'success' && needs.changes.outputs.any == 'true' &&
      needs.deployment-tests.result == 'success' &&
      (needs.test-odisseu.result == 'success' || needs.test-odisseu.result == 'skipped') &&
      (needs.test-pokemon.result == 'success' || needs.test-pokemon.result == 'skipped') &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    # Reruns of one SHA cannot race to overwrite its immutable registry tag.
    concurrency:
      group: publish-${{ matrix.service }}-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Normalize GHCR repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          owner="${OWNER,,}"
          name=zapbot
          if [[ "$SERVICE" == pokemon ]]; then name=zapbot-pokemon; fi
          echo "repository=$owner/$name" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/$owner/$name:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse existing SHA tag without overwriting it
        id: existing
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const credentials = Buffer.from(`${process.env.GITHUB_ACTOR}:${process.env.GITHUB_TOKEN}`).toString('base64');
            const tokenUrl = new URL('https://ghcr.io/token');
            tokenUrl.searchParams.set('service', 'ghcr.io');
            tokenUrl.searchParams.set('scope', `repository:${process.env.IMAGE_REPOSITORY}:pull,push`);
            const tokenResponse = await fetch(tokenUrl, {headers: {Authorization: `Basic ${credentials}`}, signal: AbortSignal.timeout(20000)});
            if (!tokenResponse.ok) throw Error(`GHCR authentication failed (HTTP ${tokenResponse.status}).`);
            const {token} = await tokenResponse.json();
            if (!token) throw Error('GHCR authentication returned no token.');
            const response = await fetch(`https://ghcr.io/v2/${process.env.IMAGE_REPOSITORY}/manifests/${process.env.GITHUB_SHA}`, {
              method: 'HEAD', signal: AbortSignal.timeout(20000),
              headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'},
            });
            if (response.status === 404) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
            else if (response.ok) {
              const digest = response.headers.get('docker-content-digest');
              if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) throw Error('GHCR returned an invalid image digest.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=true\ndigest=${digest}\n`);
              console.log(`Reusing immutable commit image ${digest}.`);
            } else throw Error(`GHCR tag lookup failed (HTTP ${response.status}); publication stopped.`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Build Linux AMD64 image before publication
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service == 'pokemon' && 'pokemon-service' || '.' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Load previously published immutable image
        if: steps.existing.outputs.exists == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest }}
        run: docker pull --platform linux/amd64 "$IMAGE_TAG@$IMAGE_DIGEST"
      - name: Assert platform and exercise isolated deployment rollback
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          fixture_image="$IMAGE_TAG"
          if [[ -n "$IMAGE_DIGEST" ]]; then fixture_image="$IMAGE_TAG@$IMAGE_DIGEST"; fi
          architecture=$(docker image inspect "$fixture_image" --format '{{.Os}}/{{.Architecture}}')
          [[ "$architecture" == linux/amd64 ]]
          revision=$(docker image inspect "$fixture_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$revision" == "$GITHUB_SHA" ]] || { echo 'Image revision differs from requested commit; publication/deploy blocked.' >&2; exit 1; }
          python3 scripts/test-deploy-docker.py --service "$SERVICE" --base-image "$fixture_image"
      - name: Publish the exact tested image without rebuilding
        if: steps.existing.outputs.exists != 'true'
        id: published
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          repository_digest=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          digest="${repository_digest##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable artifact
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.published.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy-odisseu:
    name: ${{ inputs.operation || 'deploy' }} Odisseu
    needs: [changes, publish]
    if: >-
      inputs.operation != 'check' && always() && needs.changes.result == 'success' && needs.changes.outputs.odisseu == 'true' &&
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && vars.AUTO_DEPLOY_ENABLED == 'true' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && (inputs.operation == 'rollback' || needs.publish.result == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    concurrency:
      group: production-odisseu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Request scoped deployment over verified SSH
        id: remote
        env:
          DEPLOY_SERVICE: odisseu
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          SSH_HOST: '35.238.24.225'
          SSH_USER: 'caiohclavico'
          SSH_PORT: ${{ vars.ODISSEU_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.ODISSEU_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ODISSEU_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ssh-deploy.sh
      - name: Record confirmed service operation
        if: steps.remote.outputs.performed == 'true'
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/deployed-revision"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.remote.outputs.performed == 'true'
        with:
          name: ${{ inputs.operation == 'rollback' && 'rolled-back' || 'deployed' }}-odisseu-${{ github.sha }}
          path: ${{ runner.temp }}/deployed-revision
          retention-days: 90
          overwrite: true

  deploy-pokemon:
    name: ${{ inputs.operation || 'deploy' }} Pokemon
    needs: [changes, publish]
    if: >-
      inputs.operation != 'check' && always() && needs.changes.result == 'success' && needs.changes.outputs.pokemon == 'true' &&
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && vars.AUTO_DEPLOY_ENABLED == 'true' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && (inputs.operation == 'rollback' || needs.publish.result == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    concurrency:
      group: production-pokemon
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Request scoped deployment over verified SSH
        id: remote
        env:
          DEPLOY_SERVICE: pokemon
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          SSH_HOST: ${{ vars.POKEMON_HOST || '34.68.189.66' }}
          SSH_USER: ${{ vars.POKEMON_USER || 'pokemon-deploy' }}
          SSH_PORT: ${{ vars.POKEMON_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.POKEMON_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.POKEMON_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ssh-deploy.sh
      - name: Record confirmed service operation
        if: steps.remote.outputs.performed == 'true'
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/deployed-revision"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.remote.outputs.performed == 'true'
        with:
          name: ${{ inputs.operation == 'rollback' && 'rolled-back' || 'deployed' }}-pokemon-${{ github.sha }}
          path: ${{ runner.temp }}/deployed-revision
          retention-days: 90
          overwrite: true

  check-odisseu:
    name: Check Odisseu SSH access
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    concurrency:
      group: production-odisseu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify restricted SSH diagnostic without deploying
        env:
          DEPLOY_SERVICE: odisseu
          DEPLOY_OPERATION: check
          SSH_HOST: '35.238.24.225'
          SSH_USER: 'caiohclavico'
          SSH_PORT: ${{ vars.ODISSEU_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.ODISSEU_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ODISSEU_KNOWN_HOSTS }}
        run: bash scripts/ci-ssh-deploy.sh
