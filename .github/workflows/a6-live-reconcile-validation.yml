name: A6 live-based Announcer reconciliation validation

on:
  push:
    branches:
      - fix/a6-pr68-live-reconcile
  pull_request:
    branches:
      - a6/live-baseline-8ef41c8

permissions:
  contents: read

concurrency:
  group: a6-live-reconcile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-node-live-base:
    name: Build and test live-based Node integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact live base and protected paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          base_ref=origin/a6/live-baseline-8ef41c8
          expected=8ef41c8da1c28bfb69d57bade81a5a41e9225d44
          test "$(git rev-parse "$base_ref")" = "$expected"
          merge_base="$(git merge-base HEAD "$base_ref")"
          test "$merge_base" = "$expected"
          git diff --exit-code "$base_ref...HEAD" -- \
            modules/pokemon apps/odisseu pokemon-service migrations package-lock.json
          echo "Verified live base $merge_base; protected gameplay/schema paths and lockfile unchanged."

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Set up Java for ClojureScript build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Announcer, control, restart, and transport tests
        run: npm run test:release-announcer

      - name: Existing Node resource and graceful-maintenance tests
        run: npm run test:resources

      - name: HTTP and JVM contract tests
        run: npm run test:http

      - name: Compile production ClojureScript
        run: npm run build
