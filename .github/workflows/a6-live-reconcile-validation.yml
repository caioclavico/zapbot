name: A6 live-based Node security validation

on:
  push:
    branches:
      - fix/a6-pr68-live-reconcile
      - fix/a6-node-final-security-homolog
      - fix/a6-jvm-complete-drain
      - feat/a6-rc66-trainer-on-drain-live
      - feat/a6-pokemon-growth-curves-037
  pull_request:
    branches:
      - a6/live-baseline-8ef41c8

permissions:
  contents: read

concurrency:
  group: a6-live-reconcile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-and-verify-base:
    name: Classify PR scope against live baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ancestry and classify scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          base_ref=origin/a6/live-baseline-8ef41c8
          # Tip live verificado após merge PR #80 (MT + loja/ajudas); gate fechado por SHA.
          expected=8b05886f696441fabdce06823a2513c7d8997446
          test "$(git rev-parse "$base_ref")" = "$expected"
          merge_base="$(git merge-base HEAD "$base_ref")"
          test "$merge_base" = "$expected"
          pe_paths="$(git diff --name-only "$base_ref...HEAD" -- modules/pokemon | grep -E '(^|/)036-|trainer_progression|trainer_rewards|trade_store|trade_a441|bridge_tx' || true)"
          growth_paths="$(git diff --name-only "$base_ref...HEAD" -- modules/pokemon | grep -E '(^|/)037-|growth_curves|growth-rate|domain/growth' || true)"
          # jvm-mt: learn-move / MT / shop / presenters Node de MT.
          mt_paths="$(git diff --name-only "$base_ref...HEAD" | grep -E '(^|/)mt_a6|a6_mt_move|pokemon-mt-a6|mt_learnset|learn-move|pokemon_mt_http|domain/shop|domain/moves' || true)"
          # jvm-eggs: apenas domínio/testes JVM sob modules/pokemon (não workflow CI,
          # não egg-cards Node, não pokemon-jvm-joy-eggs presenter).
          egg_paths="$(git diff --name-only "$base_ref...HEAD" -- modules/pokemon deps.edn \
            | grep -E '(^|/)(egg_activity|egg_hatch|egg_fixes|adventure_activity)\.clj$|(^|/)eggs\.clj$|deps\.edn' || true)"
          if [[ -n "$egg_paths" ]] && [[ "$egg_paths" == *deps.edn* ]]; then
            if ! git diff "$base_ref...HEAD" -- deps.edn | grep -qE 'test-a6-eggs|egg_activity|egg_hatch|egg-fixes'; then
              egg_paths="$(printf '%s\n' "$egg_paths" | grep -v 'deps\.edn' || true)"
            fi
          fi
          if [[ -n "$growth_paths" ]]; then
            echo "kind=jvm-pokemon-growth" >> "$GITHUB_OUTPUT"
            echo "Scope=jvm-pokemon-growth (growth-v2 simples + conversão segura; schema 037 preservado)."
            printf '%s\n' "$growth_paths"
          elif [[ -n "$mt_paths" ]]; then
            echo "kind=jvm-mt-move" >> "$GITHUB_OUTPUT"
            echo "Scope=jvm-mt-move (MT learn-move + consumo atômico; tip pós-#82)."
            printf '%s\n' "$mt_paths"
          elif [[ -n "$egg_paths" ]]; then
            echo "kind=jvm-eggs" >> "$GITHUB_OUTPUT"
            echo "Scope=jvm-eggs (ovos/PI/incubadoras A6)."
            printf '%s\n' "$egg_paths"
          elif [[ -n "$pe_paths" ]]; then
            echo "kind=jvm-trainer-pe" >> "$GITHUB_OUTPUT"
            echo "Scope=jvm-trainer-pe (RC #66 on drain tip; 036 additive)."
            printf '%s\n' "$pe_paths"
          elif git diff --quiet "$base_ref...HEAD" -- \
              modules/pokemon apps/odisseu shared migrations deps.edn; then
            echo "kind=node" >> "$GITHUB_OUTPUT"
            echo "Scope=node (no JVM/shared/deps gameplay paths)."
          else
            echo "kind=jvm" >> "$GITHUB_OUTPUT"
            echo "Scope=jvm-drain (JVM/shared/deps paths changed; Node-only gameplay freeze not required)."
          fi
          echo "Verified live base $merge_base"

  validate-node-live-base:
    name: Build and test live-based Node integration
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on code paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github scripts test package.json package-lock.json Dockerfile \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Set up Java for ClojureScript build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Media patch verification
        run: npm run verify:media-patch

      - name: Media security tests
        run: node --test test/pokemon-jvm-media-security.test.cjs

      - name: Egg / incubator PNG cards (Sharp)
        run: node --test test/pokemon-jvm-egg-cards.test.cjs test/pokemon-jvm-joy-eggs.test.cjs

      - name: Announcer, control, restart, and transport tests
        run: npm run test:release-announcer

      - name: Existing Node resource and graceful-maintenance tests
        run: npm run test:resources

      - name: HTTP and JVM contract tests
        run: npm run test:http

      - name: Compile production ClojureScript
        run: npm run build

  validate-jvm-drain:
    name: Build and test JVM drain / freeze gate
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'jvm'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on JVM paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github deps.edn modules apps shared scripts test \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh
          clojure -Sdescribe | head -5

      - name: Prefetch JVM deps
        run: clojure -P -M:bridge-http

      - name: Unit tests — maintenance drain / freeze / concurrency
        run: clojure -M:test-a6-maintenance-drain

      - name: Smoke — HTTP quiescence / freeze / restart
        run: clojure -M:smoke-a6-maintenance-quiescence

      - name: Smoke — drain + disposable cold fingerprint
        run: clojure -M:smoke-a6-drain-cold-rehearsal

      - name: Set up Node for maintenance tracker tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Run Node a6-maintenance tests
        run: node --test test/a6-maintenance.test.cjs

  validate-jvm-trainer-pe:
    name: Trainer PE + drain on live tip
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'jvm-trainer-pe'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on PE+drain paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github deps.edn modules apps shared scripts test migrations \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh
          clojure -Sdescribe | head -5

      - name: Prefetch JVM deps
        run: clojure -P -M:bridge-http

      - name: Unit tests — maintenance drain / freeze
        run: clojure -M:test-a6-maintenance-drain

      - name: Unit + Datomic tests — trainer PE / 036
        run: clojure -M:test-a6-trainer-progression

      - name: Unit + Datomic tests — trocas (idPokemon / growth-v1 / invalid_trade)
        run: |
          clojure -M -e "(require 'clojure.test 'pokemon.tests.trade-a441-test 'pokemon.tests.trade-public-id-test) (let [r (clojure.test/run-tests 'pokemon.tests.trade-a441-test 'pokemon.tests.trade-public-id-test)] (System/exit (if (zero? (+ (:fail r) (:error r))) 0 1)))"

      - name: Smoke — HTTP quiescence / freeze / restart
        run: clojure -M:smoke-a6-maintenance-quiescence

      - name: Set up Node for presenter tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Node maintenance + trainer progression + trade idPokemon presenters
        run: |
          node --test test/a6-maintenance.test.cjs \
            test/pokemon-trainer-progression-present.test.cjs \
            test/pokemon-trade-idpokemon.test.cjs

  validate-jvm-eggs:
    name: Eggs / PI / incubators on live tip
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'jvm-eggs'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on egg paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github deps.edn modules apps shared scripts test src \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh
          clojure -Sdescribe | head -5

      - name: Prefetch JVM deps
        run: clojure -P -M:bridge-http

      - name: Unit tests — maintenance drain / freeze
        run: clojure -M:test-a6-maintenance-drain

      - name: Unit + Datomic tests — egg activity / adventure
        run: clojure -M:test-a6-eggs-incubation

      - name: Smoke — HTTP quiescence / freeze / restart
        run: clojure -M:smoke-a6-maintenance-quiescence

      - name: Set up Node for presenter tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Node egg + maintenance presenters
        run: |
          node --test test/a6-maintenance.test.cjs \
            test/pokemon-jvm-joy-eggs.test.cjs \
            test/pokemon-jvm-present.test.cjs


  validate-jvm-mt-move:
    name: MT move learning + atomic consume on live tip
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'jvm-mt-move'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on MT paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github deps.edn modules apps shared scripts test src \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh
          clojure -Sdescribe | head -5

      - name: Prefetch JVM deps
        run: clojure -P -M:bridge-http

      - name: Unit tests — maintenance drain / freeze
        run: clojure -M:test-a6-maintenance-drain

      - name: Unit + Datomic tests — MT move learning + shop
        run: clojure -M:test-a6-mt-move-learning

      - name: Smoke — HTTP quiescence / freeze / restart
        run: clojure -M:smoke-a6-maintenance-quiescence

      - name: Set up Node for presenter / help tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install locked dependencies
        run: npm ci


      - name: Node MT + help + egg card presenters
        run: |
          node --test test/a6-maintenance.test.cjs \
            test/pokemon-mt-a6.test.cjs \
            test/pokemon-a6-ux-help-coins.test.cjs \
            test/pokemon-jvm-present.test.cjs \
            test/pokemon-jvm-egg-cards.test.cjs \
            test/pokemon-jvm-joy-eggs.test.cjs

      - name: HTTP / JVM client contracts
        run: npm run test:http

      - name: Compile production ClojureScript (handler MT + ajuda)
        run: npm run build

  validate-jvm-pokemon-growth:
    name: Pokémon growth-v2 + 037 on live tip
    needs: classify-and-verify-base
    if: needs.classify-and-verify-base.outputs.kind == 'jvm-pokemon-growth'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whitespace / conflict markers on growth paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin a6/live-baseline-8ef41c8
          git diff --check origin/a6/live-baseline-8ef41c8...HEAD -- \
            .github deps.edn modules apps shared scripts test migrations \
            ':(exclude)artifacts/**' ':(exclude)docs/**'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x /tmp/linux-install.sh
          sudo /tmp/linux-install.sh
          clojure -Sdescribe | head -5

      - name: Prefetch JVM deps
        run: clojure -P -M:bridge-http

      - name: Unit tests — maintenance drain / freeze
        run: clojure -M:test-a6-maintenance-drain

      - name: Unit tests — growth curves / level / XP / species HP
        run: clojure -M:test-a6-pokemon-growth

      - name: Unit + Datomic tests — trainer PE / 036 preserved
        run: clojure -M:test-a6-trainer-progression

      - name: Smoke — HTTP quiescence / freeze / restart
        run: clojure -M:smoke-a6-maintenance-quiescence

      - name: Set up Node for presenter tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Node maintenance + Pokémon presenters / growth-v2
        run: |
          node --test test/a6-maintenance.test.cjs test/pokemon-jvm-present.test.cjs test/pokemon-jvm-tm-xp.characterization.test.cjs test/pokemon-jvm-tm-xp.test.cjs
